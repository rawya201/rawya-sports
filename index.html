<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الراوية الرياضية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0e1a; color: #fff; line-height: 1.8; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #0a0e1a, #10162a); padding: 20px; border-bottom: 3px solid #00e676; text-align: center; }
        .header h1 { font-size: 2rem; color: #00e676; margin-bottom: 5px; }
        .header p { color: #6c7a89; font-size: 0.85rem; }
        .container { max-width: 900px; margin: 30px auto; padding: 30px; background: #10162a; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .category-badge { display: inline-block; background: linear-gradient(135deg, #00e676, #00b050); color: #0a0e1a; padding: 6px 18px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; margin-bottom: 20px; }
        .title { font-size: 2rem; font-weight: 900; line-height: 1.3; margin-bottom: 15px; color: #ffffff; }
        .meta { display: flex; gap: 20px; color: #6c7a89; font-size: 0.85rem; padding-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.06); margin-bottom: 25px; }
        .meta i { color: #00e676; margin-left: 5px; }
        .image { width: 100%; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .content { font-size: 1.05rem; color: #a8b2c1; line-height: 2; }
        .content p { margin-bottom: 20px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #00e676, #00b050); color: #0a0e1a; padding: 12px 28px; border-radius: 30px; text-decoration: none; font-weight: 800; margin-top: 30px; transition: 0.3s; }
        .back-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,230,118,0.4); }
        .loading { text-align: center; padding: 60px 20px; color: #a8b2c1; }
        .loading i { font-size: 3rem; color: #00e676; margin-bottom: 20px; }
        .error { text-align: center; padding: 60px 20px; color: #ff3838; }
        @media (max-width: 768px) { .container { padding: 20px; margin: 15px; } .title { font-size: 1.5rem; } .header h1 { font-size: 1.5rem; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚽ الراوية الرياضية</h1>
        <p>AL-RAWYA SPORTS · حيث تُروى الرياضة بإتقان</p>
    </div>

    <div class="container" id="articleContainer">
        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <p>جاري تحميل الخبر...</p>
        </div>
    </div>

    <script>
        // 👇 هنا ضعي الرابط الذي نسختيه من Apps Script 👇
        const API_URL = 'https://script.google.com/macros/s/AKfycbwhLkRKiKW9LntW2psnrdGbCPHeD_UxmVLPMNsCvAOtwJGwicoxnf_xNZvWOcUkNVa9/exec';
        
        const urlParams = new URLSearchParams(window.location.search);
        const newsId = urlParams.get('id');
        const container = document.getElementById('articleContainer');
        
        async function loadArticle() {
            if (!newsId) {
                container.innerHTML = '<div class="error"><i class="fas fa-exclamation-triangle"></i><h2>لم يتم تحديد الخبر</h2></div>';
                return;
            }
            
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result.status !== 'success') throw new Error('فشل جلب البيانات');
                
                // البحث عن الخبر المطابق للرقم الموجود في الرابط
                const article = result.data.find(n => n.ID == newsId);
                
                if (!article) {
                    container.innerHTML = '<div class="error"><i class="fas fa-search"></i><h2>الخبر غير موجود</h2></div>';
                    return;
                }
                
                // عرض الخبر (استخدمنا Title, Category, Date, Content بناءً على جدولك)
                container.innerHTML = `
                    <span class="category-badge">${getCategoryName(article.Category)}</span>
                    <h1 class="title">${article.Title}</h1>
                    <div class="meta">
                        <span><i class="fas fa-calendar"></i> ${formatDate(article.Date)}</span>
                        <span><i class="fas fa-newspaper"></i> الراوية الرياضية</span>
                    </div>
                    <img class="image" src="${article.image}" alt="${article.Title}" onerror="this.style.display='none'">
                    <div class="content">${article.Content}</div>
                    <a href="javascript:history.back()" class="back-btn">
                        <i class="fas fa-arrow-right"></i> العودة للرئيسية
                    </a>
                `;
                
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="error"><i class="fas fa-exclamation-triangle"></i><h2>تعذر تحميل الخبر</h2><p>حاولي لاحقاً</p></div>';
            }
        }
        
        function getCategoryName(cat) {
            const names = { 'football': '⚽ كرة القدم', 'basketball': '🏀 كرة السلة', 'tennis': '🎾 التنس', 'formula': '🏎️ الفورمولا', 'fighting': '🥊 قتالية', 'worldcup': '🌍 كأس العالم', 'olympics': '🥇 الأولمبيات', 'horses': '🐎 الخيل' };
            return names[cat] || 'رياضة';
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
        }
        
        loadArticle();
    </script>
</body>
</html>
